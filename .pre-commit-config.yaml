# Requires terraform, tflint, terraform-docs and checkov on PATH. Everything here also runs
# in CI; the hooks exist to catch it before the push rather than after it.
minimum_pre_commit_version: "3.5.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-yaml
      - id: mixed-line-ending
        args: [--fix=lf]
      # State and tfvars are git-ignored; a key pasted into a .tf file is not.
      - id: detect-private-key

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.105.0
    hooks:
      - id: terraform_fmt

      # -backend=false keeps the hook from touching remote state. The provider is still
      # downloaded once and then served from the plugin cache.
      - id: terraform_validate
        args:
          - --hook-config=--retry-once-with-cleanup=true
          - --tf-init-args=-backend=false

      - id: terraform_docs
        args:
          - --hook-config=--path-to-file=README.md
          - --hook-config=--add-to-existing-file=true
          - --hook-config=--create-file-if-not-exist=false
          - --args=--config=.terraform-docs.yml

      - id: terraform_tflint
        args:
          - --args=--config=__GIT_WORKING_DIR__/.tflint.hcl

      - id: terraform_checkov
        args:
          - --args=--config-file __GIT_WORKING_DIR__/.checkov.yaml

  - repo: local
    hooks:
      # go vet compiles the Terratest package. The tests themselves need an AWS account,
      # so this is as far as a pre-commit hook can go.
      - id: go-vet-terratest
        name: go vet (terratest)
        entry: sh -c 'cd test && go vet ./...'
        language: system
        files: ^test/.*\.go$
        pass_filenames: false
